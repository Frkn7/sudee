<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sude</title>
<style>
  html,body{margin:0;height:100%;background:#050816;overflow:hidden;font-family:-apple-system,"Helvetica Neue",Georgia,serif;}
  body{background:radial-gradient(ellipse at 50% 100%,#1b1f4b 0%,#0a0d2a 45%,#03040f 100%);}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;}
  #msg{
    position:fixed;left:0;right:0;bottom:14%;text-align:center;color:#fff;
    font-size:clamp(22px,6vw,34px);line-height:1.4;padding:0 28px;
    opacity:0;transform:translateY(12px);transition:opacity 2.2s ease,transform 2.2s ease;
    text-shadow:0 0 18px rgba(255,236,170,.9),0 0 40px rgba(255,220,130,.5);
    font-family:Georgia,"Times New Roman",serif;font-style:italic;pointer-events:none;
  }
  #msg.show{opacity:1;transform:translateY(0);}
  #hint{
    position:fixed;left:0;right:0;bottom:6%;text-align:center;color:rgba(255,255,255,.55);
    font-size:14px;letter-spacing:.08em;opacity:0;transition:opacity 1.5s ease;pointer-events:none;
  }
  #hint.show{opacity:1;}
  #title{
    position:fixed;left:0;right:0;top:9%;text-align:center;color:rgba(255,255,255,.85);
    font-size:clamp(18px,5vw,26px);letter-spacing:.2em;opacity:0;transition:opacity 2.5s ease;
    font-family:Georgia,serif;pointer-events:none;
  }
  #title.show{opacity:1;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">SUDE</div>
<div id="msg">Bu gökyüzünde en çok parlayan sensin prensesim</div>
<div id="hint">en parlak yıldıza dokun</div>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H,dpr=Math.min(window.devicePixelRatio||1,3);
function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
resize();addEventListener('resize',resize);

const N=170, stars=[];
for(let i=0;i<N;i++){
  stars.push({x:Math.random(),y:Math.random()*0.85,r:Math.random()*1.4+0.3,
    appear:Math.random()*6000+300,tw:Math.random()*Math.PI*2,sp:Math.random()*1.5+0.5});
}
const big={x:0.5,y:0.36,appear:7500};
let touched=false,touchT=0,shoot=[];
const t0=performance.now();

function drawStar(x,y,r,a,glow){
  ctx.globalAlpha=a;
  if(glow){
    const g=ctx.createRadialGradient(x,y,0,x,y,glow);
    g.addColorStop(0,'rgba(255,244,200,1)');g.addColorStop(0.25,'rgba(255,230,150,.5)');g.addColorStop(1,'rgba(255,220,120,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,glow,0,7);ctx.fill();
  }
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
}
function spike(x,y,len,a){
  ctx.globalAlpha=a;ctx.strokeStyle='rgba(255,240,190,.9)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(x-len,y);ctx.lineTo(x+len,y);ctx.moveTo(x,y-len);ctx.lineTo(x,y+len);ctx.stroke();
}
function frame(now){
  const t=now-t0;
  ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);
  for(const s of stars){
    const k=Math.min(Math.max((t-s.appear)/1800,0),1);
    if(k<=0)continue;
    const tw=0.65+0.35*Math.sin(t/1000*s.sp+s.tw);
    drawStar(s.x*W,s.y*H,s.r,k*tw,0);
  }
  const bk=Math.min(Math.max((t-big.appear)/2500,0),1);
  if(bk>0){
    const bx=big.x*W,by=big.y*H;
    const pulse=1+0.12*Math.sin(t/600)+(touched?Math.min(touchT/400,1)*0.8:0);
    drawStar(bx,by,3.2*pulse,bk,46*pulse);
    spike(bx,by,26*pulse,bk*0.8);
  }
  if(touched){touchT+=16;}
  for(let i=shoot.length-1;i>=0;i--){
    const s=shoot[i];s.life+=1;
    const a=1-s.life/70;if(a<=0){shoot.splice(i,1);continue;}
    ctx.globalAlpha=a;ctx.strokeStyle='#fff';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*8,s.y-s.vy*8);ctx.stroke();
    s.x+=s.vx;s.y+=s.vy;
  }
  if(Math.random()<0.004)shoot.push({x:Math.random()*W*0.8+W*0.2,y:Math.random()*H*0.3,vx:-6,vy:3.5,life:0});
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

setTimeout(()=>document.getElementById('title').classList.add('show'),1500);
setTimeout(()=>document.getElementById('hint').classList.add('show'),10000);

function tap(e){
  const p=e.touches?e.touches[0]:e;
  const dx=p.clientX-big.x*W,dy=p.clientY-big.y*H;
  const t=performance.now()-t0;
  if(t>big.appear+800 && Math.hypot(dx,dy)<70 && !touched){
    touched=true;
    document.getElementById('hint').classList.remove('show');
    document.getElementById('msg').classList.add('show');
    if(navigator.vibrate)navigator.vibrate(30);
    for(let i=0;i<5;i++)setTimeout(()=>shoot.push({x:W*0.9,y:H*0.05+i*30,vx:-6,vy:3.5,life:0}),i*350);
  }
}
addEventListener('touchstart',tap,{passive:true});
addEventListener('click',tap);
</script>
</body>
</html>
