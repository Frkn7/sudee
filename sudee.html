<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0806">
<style>html{color-scheme:dark}body{margin:0}</style>
<title>Kahve Göz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap">
<style>
/* Layout: tek büyük sahne (harflerden örülmüş göz), altında küçük bir kontrol satırı. Tek görünüm: sıcak koyu zemin. */
:root {
  --bg: #0c0806;
  --ink: #eadccb;
  --muted: #9a8574;
  --amber: #d39a52;
  --line: #2c1f17;
  --panel: #150e0a;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.55 var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px;
}
main { max-width: 1120px; margin: 0 auto; display: grid; gap: 18px; }
header { display: grid; gap: 6px; }
h1 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--amber);
}
.sub { margin: 0; color: var(--muted); max-width: 62ch; text-wrap: balance; }
.stage {
  margin: 0;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--bg);
  overflow: hidden;
  line-height: 0;
}
canvas { display: block; width: 100%; height: auto; aspect-ratio: 5 / 6; touch-action: pan-y; cursor: crosshair; background: var(--bg); }
.controls { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: end; }
.field { display: grid; gap: 6px; flex: 1 1 260px; min-width: 0; }
.field label, .seg-label {
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}
input[type="text"] {
  font: inherit;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 10px 12px;
  min-width: 0;
  width: 100%;
  box-sizing: border-box;
}
.seg { display: grid; gap: 6px; }
.seg-row { display: flex; }
.seg-row button {
  font: inherit;
  font-size: 13px;
  color: var(--muted);
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 10px 14px;
  cursor: pointer;
}
.seg-row button:first-child { border-radius: 3px 0 0 3px; }
.seg-row button:last-child { border-radius: 0 3px 3px 0; border-left: 0; }
.seg-row button[aria-pressed="true"] { color: var(--bg); background: var(--amber); border-color: var(--amber); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.note { margin: 0; font-size: 12px; color: var(--muted); }
.seg-row button#replay { border-radius: 3px; border-left: 1px solid var(--line); color: var(--ink); }
.seg-row button#replay:hover { border-color: var(--amber); }
@media (max-width: 520px) { body { padding-block: 18px; } }
/* Sade görünüm: yalnızca yüz, tam ekran. Başlık ve kontroller gizli (sayfada durur, kodu bozulmaz). */
header, .controls, .note { display: none !important; }
body { padding: 0; }
main { max-width: none; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; gap: 0; }
.stage { width: min(100vw, calc(100vh / 1.2)); width: min(100vw, calc(100svh / 1.2)); border: 0; border-radius: 0; }
</style>
</head>
<body>


<main>
  <header>
    <h1>Kahve Göz</h1>
    <p class="sub">Her nokta bir harf. Göze dokun, göz kırpsın. Fareni ya da parmağını gezdir, sana baksın.</p>
  </header>

  <figure class="stage" id="stage">
    <canvas id="eye" role="img" aria-label="Harflerden oluşan, kahverengi, gerçekçi bir göz. Göz kırpar ve imlecin yönüne bakar."></canvas>
  </figure>

  <div class="controls">
    <div class="field">
      <label for="msg">Gözün içindeki yazılar (| ile ayır)</label>
      <input id="msg" type="text" maxlength="160" value="Sude | Bak bakalım | Göz kırptım" autocomplete="off" spellcheck="false">
    </div>
    <div class="field" hidden style="display:none">
      <label for="fin">Final cümlesi</label>
      <input id="fin" type="text" maxlength="200" value="Seninle tanıştığıma çok sevindim, Sude. Umarım bu seni gülümsetmiştir." autocomplete="off" spellcheck="false">
    </div>
    <div class="seg">
      <span class="seg-label" id="seg-label">Harf düzeni</span>
      <div class="seg-row" role="group" aria-labelledby="seg-label">
        <button id="m-ramp" type="button" aria-pressed="false">Yoğunluk</button>
        <button id="m-text" type="button" aria-pressed="true">Mesaj</button>
      </div>
    </div>
    <div class="seg">
      <span class="seg-label">Animasyon</span>
      <div class="seg-row"><button id="replay" type="button">Baştan izle</button></div>
    </div>
  </div>
  <p class="note">Yoğunluk: koyu yerler seyrek, açık yerler sık harflerle yazılır.<br>Mesaj: yazdığın cümle gözün her yerine dizilir.</p>
</main>

<script>
(function () {
  "use strict";

  function report(err) {
    try {
      var box = document.getElementById("err");
      if (!box) {
        box = document.createElement("pre");
        box.id = "err";
        box.style.cssText = "white-space:pre-wrap;word-break:break-word;margin:12px 0 0;padding:10px 12px;border:1px solid #6b2b1a;border-radius:3px;background:#1a0d08;color:#f0b9a4;font:12px/1.5 monospace";
        document.body.appendChild(box);
      }
      var msg = err && (err.stack || err.message || err.reason || err);
      box.textContent = "Hata (bunu bana yaz): " + String(msg).slice(0, 600);
    } catch (e2) {}
  }
  window.addEventListener("error", function (e) { report(e.error || e.message); });
  window.addEventListener("unhandledrejection", function (e) { report(e.reason); });

  var FONT = '"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace';
  var BG = "#0c0806";
  var RAMP = " .'`^,:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
  var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function mk(w, h) { var c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
  function rr(g, x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /* ---------- Göz geometrisi (1000 x 560 birimlik sahne) ---------- */
  var CX = 500, CY = 345, EW = 360, HU = 168, HL = 110, TILT = -3, R = 132, N = 72;
  function uF(x) { return Math.pow(Math.max(0, 1 - x * x), 0.85) * (1 - 0.2 * x); }
  function lF(x) { return Math.pow(Math.max(0, 1 - x * x), 1.1) * (1 + 0.12 * x); }
  function oY(x) { return CY - TILT * x; }

  var xs = new Array(N + 1), yu = new Array(N + 1), yl = new Array(N + 1);
  var LOWER = 1, PULSE = 0;
  function lids(openU, b) {
    for (var i = 0; i <= N; i++) {
      var x = -1 + 2 * i / N, o = oY(x);
      var yuo = o - HU * openU * uF(x);
      var ylo = o + HL * LOWER * lF(x);
      var m = ylo - 10 * Math.pow(Math.max(0, 1 - x * x), 0.8);
      xs[i] = CX + x * EW;
      yu[i] = yuo + (m - yuo) * b;
      yl[i] = ylo + (m - ylo) * b;
    }
  }

  /* ---------- Sabit dokular ---------- */
  function buildIrisTexture() {
    var T = 640, c = mk(T, T), g = c.getContext("2d"), rn = mulberry32(5), cx = T / 2, Rr = T / 2, i, j, a, r, gr;
    g.save(); g.beginPath(); g.arc(cx, cx, Rr, 0, 7); g.clip();
    gr = g.createRadialGradient(cx, cx, 0, cx, cx, Rr);
    gr.addColorStop(0, "#5b2f11"); gr.addColorStop(0.3, "#b06f2f"); gr.addColorStop(0.46, "#a2611f");
    gr.addColorStop(0.7, "#764014"); gr.addColorStop(0.88, "#4a2509"); gr.addColorStop(1, "#1f0e05");
    g.fillStyle = gr; g.fillRect(0, 0, T, T);
    g.lineCap = "round";
    for (i = 0; i < 560; i++) {
      a = rn() * Math.PI * 2;
      var r0 = Rr * (0.16 + rn() * 0.2), r1 = Rr * (0.62 + rn() * 0.36);
      var light = rn() < 0.5, al = 0.05 + rn() * 0.22, da = (rn() - 0.5) * 0.07;
      g.strokeStyle = light ? "rgba(238,170,84," + al + ")" : "rgba(34,13,4," + (al * 1.3) + ")";
      g.lineWidth = 0.8 + rn() * 2.4;
      g.beginPath();
      g.moveTo(cx + Math.cos(a) * r0, cx + Math.sin(a) * r0);
      g.quadraticCurveTo(cx + Math.cos(a + da) * (r0 + r1) / 2, cx + Math.sin(a + da) * (r0 + r1) / 2,
        cx + Math.cos(a + da * 1.6) * r1, cx + Math.sin(a + da * 1.6) * r1);
      g.stroke();
    }
    g.beginPath();
    for (j = 0; j <= 120; j++) {
      a = j / 120 * Math.PI * 2;
      r = Rr * (0.5 + 0.035 * Math.sin(a * 9) + 0.02 * Math.sin(a * 17 + 1));
      if (j) g.lineTo(cx + Math.cos(a) * r, cx + Math.sin(a) * r); else g.moveTo(cx + Math.cos(a) * r, cx + Math.sin(a) * r);
    }
    g.closePath(); g.strokeStyle = "rgba(240,185,100,0.38)"; g.lineWidth = 6; g.stroke();
    for (i = 0; i < 16; i++) {
      a = rn() * Math.PI * 2; r = Rr * (0.56 + rn() * 0.22);
      g.save(); g.translate(cx + Math.cos(a) * r, cx + Math.sin(a) * r); g.rotate(a);
      g.fillStyle = "rgba(30,10,3,0.35)"; g.beginPath();
      g.ellipse(0, 0, Rr * (0.02 + rn() * 0.03), Rr * (0.045 + rn() * 0.04), 0, 0, 7); g.fill(); g.restore();
    }
    gr = g.createRadialGradient(cx, cx, Rr * 0.74, cx, cx, Rr);
    gr.addColorStop(0, "rgba(10,4,1,0)"); gr.addColorStop(0.7, "rgba(10,4,1,0.45)"); gr.addColorStop(1, "rgba(6,2,1,0.95)");
    g.fillStyle = gr; g.fillRect(0, 0, T, T);
    g.restore();
    return c;
  }

  var layers = { tex: buildIrisTexture(), bg: null, sc: null, face: null };

  function buildBg(SW, SH, k) {
    var c = mk(SW, SH), g = c.getContext("2d"), gr, i, x, y;
    g.setTransform(k, 0, 0, k, 0, 0);
    gr = g.createLinearGradient(0, 0, 0, 560);
    gr.addColorStop(0, "#e4b996"); gr.addColorStop(0.45, "#d9a785"); gr.addColorStop(1, "#cc9672");
    g.fillStyle = gr; g.fillRect(0, 0, 1000, 560);
    gr = g.createRadialGradient(CX, CY - 10, 60, CX, CY - 10, 520);
    gr.addColorStop(0, "rgba(112,50,30,0.34)"); gr.addColorStop(0.55, "rgba(112,50,30,0.14)"); gr.addColorStop(1, "rgba(112,50,30,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 1000, 560);
    gr = g.createRadialGradient(500, 300, 260, 500, 300, 720);
    gr.addColorStop(0, "rgba(40,16,8,0)"); gr.addColorStop(1, "rgba(40,16,8,0.5)");
    g.fillStyle = gr; g.fillRect(0, 0, 1000, 560);

    /* göz kapağı kıvrımı */
    function cr(xn) { return oY(xn) - HU * uF(xn) - 46 * Math.pow(Math.max(0, 1 - xn * xn), 0.6); }
    g.beginPath();
    for (i = 0; i <= N; i++) { x = -1 + 2 * i / N; if (i) g.lineTo(CX + x * EW, cr(x)); else g.moveTo(CX + x * EW, cr(x)); }
    for (i = N; i >= 0; i--) { x = -1 + 2 * i / N; g.lineTo(CX + x * EW, oY(x) - HU * uF(x)); }
    g.closePath(); g.fillStyle = "rgba(240,178,148,0.16)"; g.fill();
    g.lineJoin = "round"; g.lineCap = "round";
    var cw = [18, 11, 5], ca = [0.10, 0.16, 0.32];
    for (var s = 0; s < 3; s++) {
      g.beginPath();
      for (i = 0; i <= N; i++) { x = -1 + 2 * i / N; if (i) g.lineTo(CX + x * EW, cr(x)); else g.moveTo(CX + x * EW, cr(x)); }
      g.lineWidth = cw[s]; g.strokeStyle = "rgba(84,36,20," + ca[s] + ")"; g.stroke();
    }
    gr = g.createRadialGradient(CX - 30, CY - 215, 10, CX - 30, CY - 215, 130);
    gr.addColorStop(0, "rgba(255,225,195,0.16)"); gr.addColorStop(1, "rgba(255,225,195,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 1000, 560);

    /* göz altı gölgesi ve yanak ışığı */
    var uw = [46, 30, 16];
    for (s = 0; s < 3; s++) {
      g.beginPath();
      for (i = 0; i <= N; i++) { x = -1 + 2 * i / N; y = oY(x) + HL * lF(x) + 34; if (i) g.lineTo(CX + x * EW, y); else g.moveTo(CX + x * EW, y); }
      g.lineWidth = uw[s]; g.strokeStyle = "rgba(104,46,28,0.06)"; g.stroke();
    }
    gr = g.createRadialGradient(CX + 30, CY + 150, 10, CX + 30, CY + 150, 170);
    gr.addColorStop(0, "rgba(255,222,196,0.14)"); gr.addColorStop(1, "rgba(255,222,196,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 1000, 560);

    /* kaş */
    var rn = mulberry32(21);
    function bz(t, p0, p1, p2) { var u = 1 - t; return u * u * p0 + 2 * u * t * p1 + t * t * p2; }
    for (i = 0; i < 0; i++) { /* eski kaş kapalı, kaşlar yüz katmanında */
      var t = rn(), bx = bz(t, 150, 500, 940), by = bz(t, 118, 8, 126);
      var tx = 2 * (1 - t) * (500 - 150) + 2 * t * (940 - 500), ty = 2 * (1 - t) * (8 - 118) + 2 * t * (126 - 8);
      var ang = Math.atan2(ty, tx);
      var th = 64 * (1 - 0.6 * Math.pow(t, 1.5)) * (0.55 + 0.45 * Math.sin(Math.PI * (0.1 + 0.8 * t)));
      var off = (rn() - 0.5) * th;
      var nx = -Math.sin(ang), ny = Math.cos(ang);
      var px = bx + nx * off, py = by + ny * off;
      var ha = ang + (rn() - 0.5) * 0.4 - 0.5 * (1 - t) * (0.5 + off / th * 0.0) + (off / Math.max(th, 1)) * 0.5;
      var len = 24 + rn() * 24;
      g.strokeStyle = "rgba(38,20,11," + (0.5 + rn() * 0.4) + ")";
      g.lineWidth = 4.5 + rn() * 2;
      g.beginPath(); g.moveTo(px, py); g.lineTo(px + Math.cos(ha) * len, py + Math.sin(ha) * len); g.stroke();
    }
    return c;
  }

  function buildSclera(SW, SH, k) {
    var c = mk(SW, SH), g = c.getContext("2d"), rn = mulberry32(33), i, side, gr;
    g.setTransform(k, 0, 0, k, 0, 0);
    gr = g.createRadialGradient(CX, CY - 20, 40, CX, CY - 20, EW * 1.05);
    gr.addColorStop(0, "#f1e8de"); gr.addColorStop(0.6, "#e6d8ca"); gr.addColorStop(0.9, "#cfa99a"); gr.addColorStop(1, "#b7807a");
    g.fillStyle = gr; g.fillRect(0, 0, 1000, 560);
    g.lineCap = "round";
    for (side = -1; side <= 1; side += 2) {
      for (i = 0; i < 8; i++) {
        var sx = CX + side * EW * (0.9 + rn() * 0.06), sy = CY - 20 + (rn() - 0.5) * 120;
        var ex = CX + side * EW * (0.5 + rn() * 0.16), ey = sy + (rn() - 0.5) * 70;
        var mx = (sx + ex) / 2 + (rn() - 0.5) * 30, my = (sy + ey) / 2 + (rn() - 0.5) * 40;
        g.strokeStyle = "rgba(160,48,44," + (0.14 + rn() * 0.14) + ")";
        g.lineWidth = 1 + rn() * 1.4;
        g.beginPath(); g.moveTo(sx, sy); g.quadraticCurveTo(mx, my, ex, ey); g.stroke();
      }
    }
    var cxp = CX - EW * 0.9, cyp = oY(-0.9) + 4;
    gr = g.createRadialGradient(cxp, cyp, 2, cxp, cyp, 50);
    gr.addColorStop(0, "rgba(218,124,116,0.95)"); gr.addColorStop(0.6, "rgba(214,128,118,0.55)"); gr.addColorStop(1, "rgba(214,128,118,0)");
    g.fillStyle = gr; g.fillRect(cxp - 60, cyp - 60, 120, 120);
    gr = g.createRadialGradient(cxp + 4, cyp - 6, 1, cxp + 4, cyp - 6, 14);
    gr.addColorStop(0, "rgba(255,225,215,0.55)"); gr.addColorStop(1, "rgba(255,225,215,0)");
    g.fillStyle = gr; g.fillRect(cxp - 20, cyp - 26, 50, 50);
    return c;
  }

  /* ---------- Kirpikler ---------- */
  var lrn = mulberry32(11), lashes = [], lows = [], li;
  for (li = 0; li < 84; li++) {
    var lt = (li + lrn() * 0.8) / 84;
    lashes.push({
      t: lt, x: -0.9 + lt * 1.85,
      L: (26 + 58 * Math.pow(Math.sin(Math.PI * Math.pow(lt, 0.75)), 0.8)) * (0.88 + lrn() * 0.42),
      a: -(100 - 72 * lt) + (lrn() - 0.5) * 14,
      j: (lrn() - 0.5) * 16, w: 5.2 + lrn() * 1.8
    });
  }
  for (li = 0; li < 26; li++) {
    var mt = 0.08 + 0.88 * (li + lrn() * 0.7) / 26;
    lows.push({ t: mt, x: -1 + 2 * mt, L: 12 + lrn() * 14, a: 95 - 55 * mt + (lrn() - 0.5) * 14, w: 2.8 + lrn() * 1.2 });
  }
  function lidPoint(arr, xn) {
    var idx = (xn + 1) / 2 * N, i0 = Math.min(N - 1, Math.max(0, Math.floor(idx))), f = idx - i0;
    return [xs[i0] + (xs[i0 + 1] - xs[i0]) * f, arr[i0] + (arr[i0 + 1] - arr[i0]) * f];
  }

  /* ---------- Durum ---------- */
  var S = {
    gx: 0, gy: 0, tx: 0, ty: 0, nextSacc: 1, blinkStart: -1, nextBlink: 2.2, pendingDouble: false,
    b: 0, pointerUntil: 0, dil: 0, dilTarget: 0,
    fin: -99, fc: 0, fa: 0, t0: 0, heartT0: -99
  };
  function blinkAmount(t) {
    if (S.blinkStart < 0) return 0;
    var e = t - S.blinkStart, c = 0.085, h = 0.035, o = 0.15;
    if (e < c) { var p = e / c; return p * p; }
    if (e < c + h) return 1;
    if (e < c + h + o) { var q = (e - c - h) / o; return (1 - q) * (1 - q); }
    return -1;
  }
  function gapNext() { return REDUCED ? 6 + Math.random() * 4 : 2.4 + Math.random() * 3.8; }
  function update(t, dt) {
    var fs = t - S.t0 - FIN_AT;
    S.fin = fs;
    if (fs > -0.8) { S.tx = 0; S.ty = 0; S.nextSacc = 1e9; S.dilTarget = 0.03; }
    if (S.blinkStart < 0 && t >= S.nextBlink) {
      S.blinkStart = t;
      if (!S.pointerUntil || t > S.pointerUntil) { if (Math.random() < 0.4) S.nextSacc = t; }
    }
    var b = blinkAmount(t);
    if (b < 0) {
      S.blinkStart = -1; b = 0;
      if (S.pendingDouble) { S.pendingDouble = false; S.nextBlink = t + gapNext(); }
      else if (!REDUCED && Math.random() < 0.15) { S.pendingDouble = true; S.nextBlink = t + 0.12; }
      else S.nextBlink = t + gapNext();
    }
    if (fs > -0.8 && S.blinkStart < 0) { S.nextBlink = 1e9; S.pendingDouble = false; }
    S.fc = fs > 0 ? easeIO(fs / 1.8) : 0;
    S.fa = sstep(2.0, 3.4, fs);
    S.b = Math.max(b, S.fc);
    if (t > S.pointerUntil && t >= S.nextSacc) {
      var near = Math.random() < 0.5, amp = REDUCED ? 0.4 : 1;
      S.tx = (near ? (Math.random() - 0.5) * 50 : (Math.random() - 0.5) * 220) * amp;
      S.ty = (near ? (Math.random() - 0.5) * 12 : (Math.random() - 0.5) * 34) * amp;
      S.nextSacc = t + 0.7 + Math.random() * 2.4;
      S.dilTarget = 0;
    }
    var kk = 1 - Math.exp(-dt / 0.05);
    S.gx += (S.tx - S.gx) * kk;
    S.gy += (S.ty - S.gy) * kk;

    var ix = CX + S.gx + tremX, iy = CY - 35 + S.gy + tremY;
    var sx = 1 - 0.1 * Math.pow(Math.abs(S.gx) / 150, 2);
    var pr = R * (0.335 + 0.03 * Math.sin(t * 0.8) + 0.015 * Math.sin(t * 2.1 + 1.3) + S.dil) * (1 + 0.06 * bt);

    g.save();
    g.translate(ix, iy); g.scale(sx * (1 + 0.012 * bt), 1 + 0.012 * bt);
    g.drawImage(layers.tex, -R, -R, 2 * R, 2 * R);
    var gr = g.createRadialGradient(0, 0, pr * 0.9, 0, 0, pr + R * 0.34);
    gr.addColorStop(0, "rgba(224,152,72,0.55)"); gr.addColorStop(1, "rgba(224,152,72,0)");
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, R, 0, 7); g.fill();
    g.save();
    g.beginPath(); g.arc(0, 0, R, 0, 7); g.clip();
    g.globalCompositeOperation = "screen";
    gr = g.createRadialGradient(R * 0.25, R * 0.45, 0, R * 0.25, R * 0.45, R * 0.55);
    gr.addColorStop(0, "rgba(255,196,110,0.32)"); gr.addColorStop(1, "rgba(255,196,110,0)");
    g.fillStyle = gr; g.fillRect(-R, -R, 2 * R, 2 * R);
    g.restore();
    gr = g.createRadialGradient(0, 0, pr * 0.86, 0, 0, pr * 1.12);
    gr.addColorStop(0, "rgba(4,2,1,1)"); gr.addColorStop(0.55, "rgba(4,2,1,1)"); gr.addColorStop(1, "rgba(4,2,1,0)");
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, pr * 1.12, 0, 7); g.fill();
    g.restore();

    /* gölgeler ve ıslak çizgi */
    g.lineJoin = "round"; g.lineCap = "round";
    var uwid = [58, 40, 26, 14];
    for (w = 0; w < 4; w++) { curve(yu); g.lineWidth = uwid[w]; g.strokeStyle = "rgba(28,10,4,0.13)"; g.stroke(); }
    var lwid = [30, 16];
    for (w = 0; w < 2; w++) { curve(yl); g.lineWidth = lwid[w]; g.strokeStyle = "rgba(60,24,12,0.08)"; g.stroke(); }

    /* kornea yansımaları */
    var bx0 = CY - 35;
    var hx = CX + (ix - CX) * 0.5 - 0.30 * R, hy = bx0 + (iy - bx0) * 0.5 - 0.34 * R;
    g.save();
    g.shadowColor = "rgba(255,252,245,0.95)"; g.shadowBlur = 9 * k;
    g.fillStyle = "rgba(255,255,255,0.93)";
    g.translate(hx, hy); g.rotate(-0.2);
    rr(g, -0.2 * R, -0.15 * R, 0.4 * R, 0.3 * R, 0.07 * R); g.fill();
    g.restore();
    g.save();
    g.shadowColor = "rgba(255,240,220,0.9)"; g.shadowBlur = 6 * k;
    g.fillStyle = "rgba(255,246,232,0.55)";
    g.beginPath(); g.arc(CX + (ix - CX) * 0.5 + 0.34 * R, bx0 + (iy - bx0) * 0.5 + 0.3 * R, 0.07 * R, 0, 7); g.fill();
    g.restore();

    var wl = Math.min(1, 1);
    g.beginPath();
    for (i = 0; i <= N; i++) { if (i) g.lineTo(xs[i], yl[i] - 5); else g.moveTo(xs[i], yl[i] - 5); }
    g.lineWidth = 4; g.strokeStyle = "rgba(255,238,225," + (0.38 * wl) + ")"; g.stroke();
    if (ts && ts.fill > 0.01) {
      g.beginPath();
      for (i = 0; i <= N; i++) { if (i) g.lineTo(xs[i], yl[i] - 6); else g.moveTo(xs[i], yl[i] - 6); }
      g.lineWidth = 9; g.strokeStyle = "rgba(255,240,228," + (0.5 * ts.fill) + ")"; g.stroke();
      g.beginPath();
      for (i = 0; i <= N; i++) { if (i) g.lineTo(xs[i], yl[i] - 10); else g.moveTo(xs[i], yl[i] - 10); }
      g.lineWidth = 3; g.strokeStyle = "rgba(255,255,255," + (0.5 * ts.fill) + ")"; g.stroke();
    }
    g.restore();

    /* kapak kenarları */
    var seg, tt;
    g.lineCap = "round";
    for (seg = 0; seg < N; seg++) {
      tt = seg / N;
      var lw = 3 + 10 * Math.pow(Math.sin(Math.PI * tt), 0.8) * (0.7 + 0.3 * tt);
      g.beginPath(); g.moveTo(xs[seg], yu[seg]); g.lineTo(xs[seg + 1], yu[seg + 1]);
      g.lineWidth = lw; g.strokeStyle = "rgba(24,11,7,0.96)"; g.stroke();
    }
    curve(yl); g.lineWidth = 3.5; g.strokeStyle = "rgba(95,45,35,0.7)"; g.stroke();

    /* üst kirpikler */
    g.lineWidth = 4; g.strokeStyle = "rgba(22,10,6,0.9)";
    for (i = 0; i < lashes.length; i++) {
      var l = lashes[i], p0 = lidPoint(yu, l.x);
      var closedA = 62 - 38 * l.t + l.j;
      var a = (l.a * (1 - b) + closedA * b) * Math.PI / 180;
      var p1x = p0[0] + Math.cos(a) * l.L * 0.55, p1y = p0[1] + Math.sin(a) * l.L * 0.55;
      var target = (-90 * (1 - b) + 90 * b) * Math.PI / 180;
      var a2 = a + (target - a) * 0.35;
      var p2x = p1x + Math.cos(a2) * l.L * 0.55, p2y = p1y + Math.sin(a2) * l.L * 0.55;
      g.lineWidth = l.w;
      g.beginPath(); g.moveTo(p0[0], p0[1]); g.quadraticCurveTo(p1x, p1y, p2x, p2y); g.stroke();
    }
    /* alt kirpikler */
    g.strokeStyle = "rgba(30,14,8," + (0.2 + 0.4 * (1 - b)) + ")";
    for (i = 0; i < lows.length; i++) {
      var m = lows[i], q0 = lidPoint(yl, m.x), ma = m.a * Math.PI / 180;
      g.lineWidth = m.w;
      g.beginPath(); g.moveTo(q0[0], q0[1]);
      g.quadraticCurveTo(q0[0] + Math.cos(ma) * m.L * 0.6, q0[1] + Math.sin(ma) * m.L * 0.6,
        q0[0] + Math.cos(ma - 0.3) * m.L, q0[1] + Math.sin(ma - 0.3) * m.L);
      g.stroke();
    }
    drawTear(ts);
  }

  /* ---------- Harflere dönüştür ---------- */
  var mode = "text";
  function setMessage(v) {
    var parts = String(v || "").split("|").map(function (p) { return p.trim().replace(/\s+/g, " "); }).filter(Boolean);
    if (!parts.length) parts = ["Sude"];
    msgs = parts.map(function (p) { return Array.from(p).map(function (c) { return c === " " ? "·" : c; }); });
    mCur = 0; mPrev = 0; mT0 = performance.now() / 1000;
  }

  function sample() {
    mctx.imageSmoothingEnabled = true; mctx.imageSmoothingQuality = "high";
    mctx.drawImage(scene, 0, 0, mid.width, mid.height);
    smctx.imageSmoothingEnabled = true; smctx.imageSmoothingQuality = "high";
    smctx.drawImage(mid, 0, 0, cols, rows);
    return smctx.getImageData(0, 0, cols, rows).data;
  }

  function colorOf(R_, G_, B_, lum) {
    var m = Math.max(R_, G_, B_, 1);
    var f = (95 + 160 * Math.pow(lum, 0.7)) * (1 + 0.2 * PULSE) / m;
    return "rgb(" + Math.min(255, R_ * f | 0) + "," + Math.min(255, G_ * f | 0) + "," + Math.min(255, B_ * f | 0) + ")";
  }

  function renderText(data, t) {
    var cw = W / cols, ch = H / rows, r, c, i, lum, idx;
    ctxT.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctxT.fillStyle = BG; ctxT.fillRect(0, 0, W, H);
    ctxT.textAlign = "center"; ctxT.textBaseline = "middle";

    if (mode === "ramp") {
      ctxT.font = "600 " + (ch * 0.95).toFixed(2) + "px " + FONT;
      var tick = REDUCED ? 0 : Math.floor(t * 7), L = RAMP.length - 1;
      for (r = 0; r < rows; r++) {
        for (c = 0; c < cols; c++) {
          i = (r * cols + c) * 4;
          lum = (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) / 255;
          if (lum < 0.045) continue;
          idx = Math.floor(Math.pow(lum, 0.85) * L);
          if (idx > 4 && idx < L - 1) {
            var h = (Math.imul(c, 73856093) ^ Math.imul(r, 19349663) ^ Math.imul(tick, 83492791)) >>> 0;
            if (h % 100 < 12) idx += (h >> 8) & 1 ? 1 : -1;
          }
          if (idx <= 0) continue;
          ctxT.fillStyle = colorOf(data[i], data[i + 1], data[i + 2], lum);
          ctxT.fillText(RAMP.charAt(idx), (c + 0.5) * cw, (r + 0.5) * ch + ch * 0.04);
        }
      }
    } else {
      var lv = new Uint8Array(cols * rows), q, MA, MB, nA, nB, uu, pick;
      if (msgs.length > 1 && t - mT0 > MSG_PERIOD && S.fin < 0) { mPrev = mCur; mCur = (mCur + 1) % msgs.length; mT0 = t; }
      MA = msgs[mPrev]; MB = msgs[mCur]; nA = MA.length; nB = MB.length; uu = (t - mT0) / 1.1;
      for (r = 0; r < rows; r++) {
        for (c = 0; c < cols; c++) {
          i = (r * cols + c) * 4;
          lum = (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) / 255;
          lum = clamp((lum - 0.08) / 0.8, 0, 1);
          lv[r * cols + c] = lum < 0.03 ? 0 : clamp(Math.floor(Math.pow(lum, 1.05) * 6) + 1, 1, 5);
        }
      }
      for (q = 1; q <= 5; q++) {
        ctxT.font = (q >= 4 ? 700 : 500) + " " + (ch * (0.45 + 0.14 * q)).toFixed(2) + "px " + FONT;
        for (r = 0; r < rows; r++) {
          for (c = 0; c < cols; c++) {
            if (lv[r * cols + c] !== q) continue;
            i = (r * cols + c) * 4;
            lum = clamp(((0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) / 255 - 0.08) / 0.8, 0, 1);
            ctxT.fillStyle = colorOf(data[i], data[i + 1], data[i + 2], lum);
            pick = (uu >= 1 || MA === MB || uu >= (c / cols) * 0.6 + (((r * 131 + c * 71 + r * c) % 97) / 97) * 0.4)
              ? MB[(r * cols + c) % nB] : MA[(r * cols + c) % nA];
            ctxT.fillText(pick, (c + 0.5) * cw, (r + 0.5) * ch + ch * 0.04);
          }
        }
      }
    }
  }

  /* ---------- Kurulum ve döngü ---------- */
  function setup() {
    if (!stage || !cv || !ctxT) return false;
    /* WhatsApp iOS bazen ilk açılışta WebView ölçülerini henüz vermiyor.
       Sıfır genişlikte kurulum yapma; görünür ölçü gelince yeniden dene. */
    var rect = stage.getBoundingClientRect();
    var w = Math.round(rect.width || stage.clientWidth || 0);
    if (w < 80 || !stage.isConnected) return false;
    try {
      W = w; H = Math.round(W * ASP);
      cols = clamp(Math.round(W / 2.9), 120, 260);
      rows = Math.max(1, Math.round(cols * ASP / 1.8));
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      cv.style.width = "100%"; cv.style.height = H + "px";
      SW = cols * 6; SH = Math.round(SW * ASP); SHE = Math.round(SW * 0.56); k = SW / 1000;
      scene = mk(SW, SH);
      eyeCv = mk(SW, SHE); g = eyeCv.getContext("2d");
      mid = mk(cols * 2, rows * 2); mctx = mid.getContext("2d");
      small = mk(cols, rows);
      try { smctx = small.getContext("2d", { willReadFrequently: true }); } catch (ctxErr) { smctx = null; }
      if (!smctx) smctx = small.getContext("2d");
      if (!g || !mctx || !smctx) throw new Error("Bu tarayıcı 2D canvas desteği sağlayamadı.");
      layers.face = buildFace(SW, SH, k);
      EHD = EWD * 560 / 824; tmpE = mk(Math.round(EWD * k), Math.round(EHD * k));
      layers.bg = buildBg(SW, SHE, k);
      layers.sc = buildSclera(SW, SHE, k);
      last = 0;
      tick(performance.now(), true);
      return true;
    } catch (err) {
      scene = null;
      report(err);
      return false;
    }
  }

  var setupTimer = 0, setupAttempts = 0;
  function requestSetup() {
    if (setupTimer) clearTimeout(setupTimer);
    setupTimer = setTimeout(function retrySetup() {
      setupTimer = 0;
      if (setup()) { setupAttempts = 0; return; }
      if (setupAttempts++ < 20) setupTimer = setTimeout(retrySetup, 180);
    }, 60);
  }

  /* iki göz yüzün üstüne yumuşak maskeyle oturur; sol göz aynalanmış, bakış ikisinde de aynı yöne gider */
  function placeEye(sc, cx, flip) {
    var tc = tmpE.getContext("2d"), w = tmpE.width, h = tmpE.height, sx = SW * 0.088, sw = SW * 0.824;
    tc.setTransform(1, 0, 0, 1, 0, 0);
    tc.globalCompositeOperation = "source-over"; tc.clearRect(0, 0, w, h);
    if (flip) { tc.translate(w, 0); tc.scale(-1, 1); }
    tc.drawImage(eyeCv, sx, 0, sw, SHE, 0, 0, w, h);
    tc.setTransform(1, 0, 0, 1, 0, 0);
    tc.globalCompositeOperation = "destination-in";
    var gv = tc.createLinearGradient(0, 0, 0, h);
    gv.addColorStop(0, "rgba(0,0,0,0)"); gv.addColorStop(0.3, "rgba(0,0,0,1)"); gv.addColorStop(0.72, "rgba(0,0,0,1)"); gv.addColorStop(1, "rgba(0,0,0,0)");
    tc.fillStyle = gv; tc.fillRect(0, 0, w, h);
    var gh = tc.createLinearGradient(0, 0, w, 0);
    gh.addColorStop(0, "rgba(0,0,0,0)"); gh.addColorStop(0.07, "rgba(0,0,0,1)"); gh.addColorStop(0.93, "rgba(0,0,0,1)"); gh.addColorStop(1, "rgba(0,0,0,0)");
    tc.fillStyle = gh; tc.fillRect(0, 0, w, h);
    sc.drawImage(tmpE, cx - EWD / 2, 560 - EHD * 345 / 560, EWD, EHD);
  }
  function drawBoth(t) {
    var sc = scene.getContext("2d");
    sc.setTransform(k, 0, 0, k, 0, 0);
    sc.globalAlpha = 1; sc.globalCompositeOperation = "source-over";
    sc.drawImage(layers.face, 0, 0, 1000, SH / k);
    drawScene(t);
    placeEye(sc, 640, false);
    var gx0 = S.gx; S.gx = -gx0;
    drawScene(t);
    S.gx = gx0;
    placeEye(sc, 360, true);
  }

  var last = 0, running = false;
  function tick(now, force) {
    if (!scene) return;
    if (!force && now - last < 32) return;
    var dt = Math.min(0.1, Math.max(0.001, (now - last) / 1000));
    last = now;
    var t = now / 1000;
    update(t, dt);
    if (S.fa < 0.999) {
      drawBoth(t);
      var dd = sample();
      applyHeart(dd, t);
      renderText(dd, t);
    } else {
      ctxT.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctxT.fillStyle = BG; ctxT.fillRect(0, 0, W, H);
    }
    drawFinale();
  }
  function loop(now) { requestAnimationFrame(loop); tick(now, false); }

  function aim(e) {
    var rect = cv.getBoundingClientRect();
    if (!rect.width) return;
    var ux = (e.clientX - (rect.left + rect.width / 2)) / rect.width * 1000;
    var uy = (e.clientY - (rect.top + rect.height / 2)) / rect.height * 560;
    var dx = clamp(ux / 500, -1, 1), dy = clamp(uy / 280, -1, 1);
    S.tx = dx * 150; S.ty = dy * 36;
    S.dilTarget = 0.04 * (1 - Math.min(1, Math.hypot(dx, dy)));
    S.pointerUntil = performance.now() / 1000 + 3;
  }

  function init() {
    stage = document.getElementById("stage");
    cv = document.getElementById("eye");
    ctxT = cv.getContext("2d");
    S.t0 = performance.now() / 1000;
    var input = document.getElementById("msg");
    var bR = document.getElementById("m-ramp"), bT = document.getElementById("m-text");
    function setMode(m) {
      mode = m;
      bR.setAttribute("aria-pressed", m === "ramp" ? "true" : "false");
      bT.setAttribute("aria-pressed", m === "text" ? "true" : "false");
    }
    bR.addEventListener("click", function () { setMode("ramp"); });
    bT.addEventListener("click", function () { setMode("text"); });
    input.addEventListener("input", function () { setMessage(input.value); setMode("text"); });
    setMessage(input.value);
    var finIn = document.getElementById("fin");
    function readFin() { var v = String(finIn.value || "").trim(); FIN_TEXT = v || DEFAULT_FIN; }
    finIn.addEventListener("input", readFin); readFin();
    document.getElementById("replay").addEventListener("click", restart);
    window.__drive = function (ms) { tick(ms, true); };

    window.addEventListener("pointermove", aim, { passive: true });
    cv.addEventListener("pointerdown", function (e) {
      aim(e);
      if (S.blinkStart < 0) S.nextBlink = 0;
      var ns = performance.now() / 1000;
      if (S.fin < -0.8 && ns - S.heartT0 > 3.2) S.heartT0 = ns;
    });
    if (window.ResizeObserver) {
      new ResizeObserver(requestSetup).observe(stage);
    }
    window.addEventListener("resize", requestSetup, { passive: true });
    window.addEventListener("orientationchange", requestSetup, { passive: true });
    window.addEventListener("pageshow", function () { requestSetup(); if (!running && !window.__MANUAL) { running = true; requestAnimationFrame(loop); } }, { passive: true });
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) { requestSetup(); last = 0; }
    });
    if (window.visualViewport) window.visualViewport.addEventListener("resize", requestSetup, { passive: true });
    requestSetup();
    /* WhatsApp WebView'da ilk layout gecikebilir; birkaç ayrı anda ölçüyü tekrar al. */
    setTimeout(requestSetup, 250);
    setTimeout(requestSetup, 800);
    if (!running && !window.__MANUAL) { running = true; requestAnimationFrame(loop); }
  }

  try { init(); } catch (err) { report(err); }
  try {
    if (document.fonts && document.fonts.load) {
      ["500", "600", "700"].forEach(function (w) {
        document.fonts.load(w + ' 16px "IBM Plex Mono"', "şğıİçöü").catch(function () {});
      });
      document.fonts.load('italic 500 20px "Cormorant Garamond"', "özür şğıİçöü").catch(function () {});
    }
  } catch (e3) {}
})();
</script>
